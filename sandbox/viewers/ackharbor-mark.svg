<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gSend" x1="14" y1="40" x2="50" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B18"/>
      <stop offset="100%" stop-color="#3D342C"/>
    </linearGradient>
    <linearGradient id="gAck" x1="50" y1="24" x2="14" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F26B1D"/>
      <stop offset="100%" stop-color="#D4550A"/>
    </linearGradient>
  </defs>
  <!-- send arc (navy→teal-ish) -->
  <path d="M16 42 A21 21 0 0 1 46 22" fill="none" stroke="url(#gSend)" stroke-width="7.5" stroke-linecap="round"/>
  <!-- arrowhead at send tip (near 50,24) pointing along arc -->
  <path d="M42 18 L52 22 L44 30" fill="none" stroke="#1E1B18" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ack arc -->
  <path d="M46 28 A21 21 0 0 1 18 40" fill="none" stroke="url(#gAck)" stroke-width="7.5" stroke-linecap="round"/>
  <!-- arrowhead at ack tip (near 14,40) -->
  <path d="M22 34 L12 42 L22 46" fill="none" stroke="#F26B1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
